name: Build and deploy

on:
  schedule:
    - cron: '0 22 * * *'   # 毎日 22:00 UTC ≒ 翌 07:00 JST（頻度は好みで調整）
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write   # news.json のコミット用
  pages: write
  id-token: write

concurrency:
  group: build-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Fetch news
        run: npm run fetch

      - name: Commit updated news.json
        run: |
          if ! git diff --quiet -- src/data/news.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add src/data/news.json
            git commit -m "chore: update news.json"
            git push
          else
            echo "news.json unchanged"
          fi

      - name: Build
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
          SITE_URL: https://${{ github.repository_owner }}.github.io

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
