name: Update news and deploy

# 毎日ニュースを取得して news.json を更新（コミット）し、GitHub Pages へ公開する。

on:
  schedule:
    - cron: '0 22 * * *' # 毎日 22:00 UTC ≒ 翌 07:00 JST
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: # ドキュメントだけの変更では動かさない
      - '**.md'
      - 'docs/**'

permissions:
  contents: write # news.json のコミット用
  pages: write
  id-token: write

concurrency:
  group: update-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # push 時はコードのデプロイだけ行い、ニュース更新は cron / 手動に任せる
      # （push のたびに news.json コミットが増えて開発ブランチと競合するのを防ぐ）
      - name: Fetch news
        if: github.event_name != 'push'
        run: npm run fetch

      - name: Commit updated news.json
        if: github.event_name != 'push'
        run: |
          if git diff --quiet -- src/data/news.json src/data/meta.json; then
            echo "news.json unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/news.json src/data/meta.json
          git commit -m "chore: news.json を更新"
          # 人の push と競合したら rebase して数回リトライする
          for i in 1 2 3; do
            if git push; then
              exit 0
            fi
            echo "push rejected (attempt $i) — rebasing onto origin/main"
            git pull --rebase --autostash origin main || exit 1
          done
          echo "could not push news.json after 3 attempts" >&2
          exit 1

      - name: Build
        run: npm run build
        env:
          # github.repository は全トリガーで確実に入る（event ペイロード依存を避ける）
          BASE_PATH: /${{ github.event.repository.name || 'my-ai-news' }}/
          SITE_URL: https://${{ github.repository_owner }}.github.io

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
